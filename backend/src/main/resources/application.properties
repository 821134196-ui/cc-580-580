# ---- 数据源：SQLite（WAL 模式 + busy_timeout，保证并发写入串行化而不是报错） ----
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:cert-platform.db?journal_mode=WAL&busy_timeout=10000&synchronous=NORMAL
quarkus.datasource.jdbc.max-size=8

# ---- Hibernate ----
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql
quarkus.hibernate-orm.log.sql=false

# ---- HTTP ----
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# ---- 测试环境使用独立数据库文件 ----
%test.quarkus.datasource.jdbc.url=jdbc:sqlite:target/test-cert-platform.db?journal_mode=WAL&busy_timeout=10000&synchronous=NORMAL
